name: Build iOS dependency layer

on:
  workflow_dispatch:
    inputs:
      family:
        description: Dependency family (families.json)
        required: true
        type: choice
        options: [modern, legacy, ancient]
      source_version:
        description: Build from this member's branch instead of the baseline (verification builds; never published)
        required: false
        default: ''
      publish:
        description: Publish a deps-<family>-r<N> release when every gate passes
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAMILY: ${{ inputs.family }}
      SOURCE_VERSION: ${{ inputs.source_version }}
    outputs:
      bundle: ${{ steps.config.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve family
        id: config
        run: |
          python3 tools/runtime/ci.py deps-config >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.config.outputs.branch }}
          path: src
          fetch-depth: 0

      - name: Fetch the upstream tag the branch is based on
        working-directory: src
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("renpylinter.lock.json"))["renpy_build_tag"])')
          git fetch --no-tags https://github.com/renpy/renpy-build.git "refs/tags/$tag:refs/tags/$tag"

      - uses: astral-sh/setup-uv@v6

      - name: Install build tools
        run: brew install pkg-config ccache lld xz openssl@3 libffi

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-deps-${{ inputs.family }}-xcode26.6-${{ github.run_id }}
          restore-keys: ccache-deps-${{ inputs.family }}-xcode26.6-

      - name: Fetch inputs
        run: python3 tools/runtime/ci.py deps-inputs

      - name: Prepare build environment
        run: python3 tools/runtime/driver.py prepare --src src

      - name: Build and gate
        run: |
          set -o pipefail
          python3 -u tools/runtime/ci.py deps-build 2>&1 | tee build.log

      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-logs-${{ inputs.family }}-${{ github.run_id }}
          path: |
            build.log
            src/tmp/rpl-logs/
            src/tmp/build/**/config.log
            src/tmp/build/**/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Retain bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.bundle }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: inputs.publish && inputs.source_version == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: deps-release-${{ inputs.family }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/runtime
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: dist
      - name: Verify bundle and choose revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ inputs.family }}
        run: python3 tools/runtime/ci.py release-prepare --kind deps --name "$FAMILY"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/runtime/ci.py release-publish
