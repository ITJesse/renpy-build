name: Build RenPyLinter iOS runtime
on:
  push:
    branches: ['renpylinter/8.5.3']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require a version maintenance branch
        run: test -f tools/runtime/lock.json || { echo 'Select a renpylinter/<version> branch for this workflow'; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
      - name: Install build tools
        run: |
          brew install autoconf autoconf-archive automake libtool pkg-config
          python3 -m venv tmp/runtime-tools
          tmp/runtime-tools/bin/pip install Jinja2==3.1.4 MarkupSafe==2.1.5 requests==2.32.3 Cython==3.1.4 cmake==3.31.6 ninja==1.11.1.3
          echo "$PWD/tmp/runtime-tools/bin" >> "$GITHUB_PATH"
      - name: Select locked bundle directory
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('tools/runtime/lock.json') as f:
              version = json.load(f)['engine']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RUNTIME_BUNDLE=dist/renpy-runtime-' + version + '\n')
          PYCODE
      - name: Build arm64 device and arm64 simulator
        run: |
          set -o pipefail
          python3 -u tools/runtime/native.py 2>&1 | tee tmp/runtime-build.log
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-logs-${{ github.sha }}
          path: |
            tmp/runtime-build.log
            tmp/runtime-link-*.link.log
            tmp/build/**/config.log
      - name: Retain validated engine bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ github.sha }}
          path: ${{ env.RUNTIME_BUNDLE }}/
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: runtime-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-${{ github.sha }}
          path: bundle
      - name: Package immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          (cd bundle && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          info=json.loads(pathlib.Path('bundle/build-info.json').read_text())
          assert info['source_commit']==os.environ['SOURCE_COMMIT']
          assert info['platforms']==['iphoneos-arm64','iphonesimulator-arm64']
          assert len(info['validation']['link_checks'])==2
          engine=info['engine_version']
          tags=subprocess.check_output(['gh','api','--paginate','repos/'+os.environ['GH_REPO']+'/releases','--jq','.[].tag_name'],text=True).splitlines()
          refs=subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/git/matching-refs/tags/renpy-runtime-'+engine+'-r','--jq','.[].ref'],text=True).splitlines()
          tags += [ref.removeprefix('refs/tags/') for ref in refs]
          revisions=[int(m[1]) for tag in tags if (m:=re.fullmatch('renpy-runtime-'+re.escape(engine)+r'-r(\d+)',tag))]
          tag='renpy-runtime-'+engine+'-r'+str(max(revisions,default=0)+1)
          archive='renpy-runtime-'+engine+'-ios-arm64.tar.gz'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_TAG='+tag+'\nARCHIVE='+archive+'\nSOURCE_DATE_EPOCH='+str(info['source_lock']['source_date_epoch'])+'\n')
          pathlib.Path('notes.md').write_text('RenPy '+engine+' complete engine core, Python '+info['python_version']+'.\n\n'
              +'Source commit: '+info['source_commit']+'\n\n'
              +'Device arm64 and Simulator arm64, minimum iOS '+info['minimum_ios']+'. Libraries and source-only Python resources are versioned together.\n\n'
              +'Archive/platform/export/resource/checksum validation and closed-symbol links passed against the pinned build dependencies. '
              +'Application dependency link checks, game execution and restart lifecycle validation are separate. '
              +'Host main.py/helper_tool.rpy adaptations remain host-owned; read HOST-INTEGRATION.md before integrating.\n\n'
              +'Workflow: '+os.environ['WORKFLOW_URL']+'\n')
          PY
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - -C bundle . | gzip -n > "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_COMMIT"
          gh release create "$RELEASE_TAG" --verify-tag --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TAG" --notes-file notes.md \
            "$ARCHIVE" "$ARCHIVE.sha256" bundle/build-info.json bundle/SHA256SUMS
