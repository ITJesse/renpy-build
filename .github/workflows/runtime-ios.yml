name: Build RenPyLinter iOS runtime
on:
  push:
    branches: ['renpylinter/8.5.3']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
          python3 -m venv tmp/runtime-tools
          tmp/runtime-tools/bin/pip install Jinja2==3.1.4 MarkupSafe==2.1.5 requests==2.32.3 Cython==3.1.4 cmake==3.31.6 ninja==1.11.1.3
          echo "$PWD/tmp/runtime-tools/bin" >> "$GITHUB_PATH"
      - name: Build arm64 device and arm64 simulator
        run: |
          set -o pipefail
          python3 -u tools/runtime/native.py 2>&1 | tee tmp/runtime-build.log
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-logs-${{ github.sha }}
          path: |
            tmp/runtime-build.log
            tmp/build/**/config.log
      - name: Retain validated engine bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ github.sha }}
          path: dist/renpy-runtime-*/
          if-no-files-found: error
